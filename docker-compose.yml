version: '3.9'

services:
  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend-network

  ocr-worker:
    build:
      context: .
      dockerfile: apps/ocr-worker/Dockerfile
    restart: always
    environment:
      - UV_THREADPOOL_SIZE=12
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}?connection_limit=15
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=receipts
    depends_on:
      - redis
      - minio
    networks:
      - backend-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}?connection_limit=15
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=receipts
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - minio
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  minio_data:

